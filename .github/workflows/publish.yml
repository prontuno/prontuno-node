name: Publish

# Publishes to npm when a GitHub release is published. npm authenticates this workflow as a
# trusted publisher (OIDC), so no npm token is stored, and the package gets provenance.
on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: npm

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing needs npm 11.5.1 or later.
            - name: Update npm
              run: npm install --global npm@11

            - name: Check the release tag matches package.json
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  VERSION="v$(node -p 'require("./package.json").version')"
                  if [ "$TAG" != "$VERSION" ]; then
                      echo "Release tag $TAG doesn't match package.json version $VERSION." >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            # prepublishOnly runs the quality checks and tests (which build dist/) before uploading.
            - name: Publish
              run: npm publish
